name: Package plugin release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build WordPress plugin ZIP
        run: |
          mkdir -p dist/opentrip-engine
          cp -R opentrip-engine.php includes assets languages readme.txt LICENSE README.md SECURITY.md dist/opentrip-engine/
          cd dist
          zip -qr "opentrip-engine-${GITHUB_REF_NAME}.zip" opentrip-engine
          unzip -l "opentrip-engine-${GITHUB_REF_NAME}.zip"
      - name: Attach ZIP to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/opentrip-engine-${{ github.ref_name }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
